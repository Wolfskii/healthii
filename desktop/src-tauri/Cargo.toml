[workspace]

[package]
name = "healthii-desktop"
version = "0.1.0"
description = "Healthii desktop application"
authors = ["Healthii contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "healthii_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]
