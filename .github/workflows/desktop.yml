name: Desktop

on:
  workflow_call:
  workflow_dispatch:
  push:
    paths:
      - "desktop/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/desktop.yml"

jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w @healthii/desktop
      - run: npm run test -w @healthii/desktop
      - run: npm run build -w @healthii/desktop
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Check Tauri crate
        run: cargo check --manifest-path desktop/src-tauri/Cargo.toml
        continue-on-error: true
